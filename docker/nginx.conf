# Adstic — jedyny publiczny kontener.
#
# Polityka URL: trailing slash ZAWSZE (astro.config.mjs → trailingSlash: 'always').
# Zmiana polityki wymaga jednoczesnej zmiany Astro, linków wewnętrznych,
# canonicali i sitemapy — wariantów nie wolno mieszać (standard xCloud §11.1).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    '' $server_port;
}

upstream payload_cms {
    server payload:3000;
}

server {
    listen 8080;
    server_name _;

    # Bez tego Nginx wstawia wewnętrzny :8080 w redirecty katalogów.
    absolute_redirect off;
    port_in_redirect off;

    root /srv/website/current;
    index index.html;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Payload: panel, API, assety Next ────────────────────────────────────
    # Całego /api NIE wolno blokować — panel używa go do logowania i zapisu.
    # Dostęp do kolekcji kontroluje Payload Access Control (§22).

    location = /admin {
        proxy_pass http://payload_cms;
        include /etc/nginx/proxy_params;
    }

    location ^~ /admin/ {
        proxy_pass http://payload_cms;
        include /etc/nginx/proxy_params;
    }

    location = /api {
        proxy_pass http://payload_cms;
        include /etc/nginx/proxy_params;
    }

    # Obejmuje również /api/media/file/* — publiczne obrazy strony.
    location ^~ /api/ {
        proxy_pass http://payload_cms;
        include /etc/nginx/proxy_params;
    }

    location ^~ /_next/ {
        proxy_pass http://payload_cms;
        include /etc/nginx/proxy_params;
    }

    # ── Statyczne Astro ─────────────────────────────────────────────────────

    # Zasoby z hashem w nazwie — nigdy się nie zmieniają pod tym samym URL-em.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Self-hostowane fonty. UWAGA (PLAYBOOK P-014): pliki z public/ NIE dostają
    # hasza w nazwie, więc `immutable` jest tu obietnicą, nie faktem — zmieniasz
    # treść pliku (inny subset, inna waga), zmieniasz jego nazwę. Inaczej
    # wracający użytkownik zostaje ze starym fontem na rok.
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /video/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /sitemap-index.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
