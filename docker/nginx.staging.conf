# Adstic — router stagingu etapu 1.
#
# Nie ma tu upstreamu Payloada celowo: upstream wskazujący na nieistniejącą
# usługę uniemożliwia start Nginxa, nawet jeśli żaden gość nie wejdzie na
# /admin ani /api.
#
# Polityka URL: trailing slash ZAWSZE (astro.config.mjs → trailingSlash: 'always').

server {
    listen 8080;
    server_name _;

    # Bez tego Nginx wstawia wewnętrzny :8080 w redirecty katalogów.
    absolute_redirect off;
    port_in_redirect off;

    root /srv/website/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /_next/ {
        return 404;
    }

    # Zasoby z hashem w nazwie — nigdy się nie zmieniają pod tym samym URL-em.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Self-hostowane fonty. UWAGA (PLAYBOOK P-014): pliki z public/ NIE dostają
    # hasza w nazwie, więc `immutable` jest tu obietnicą, nie faktem — zmieniasz
    # treść pliku, zmieniasz jego nazwę.
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /video/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /sitemap-index.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
